[project]
name = "binance-trading-toolkit"
version = "0.3.3"
description = "Shared Binance USDⓈ-M futures client with stable-ID order observation, native stops, position query, and audit utilities"
requires-python = ">=3.11"
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.setuptools.packages.find]
include = ["binance_trading_toolkit*"]
